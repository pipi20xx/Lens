# docker-compose.frontend-dev.yml
#
# 前端开发环境 — 前后端分离，改代码即时生效
#
# 启动：docker compose -f docker-compose.frontend-dev.yml up
# 停止：docker compose -f docker-compose.frontend-dev.yml down
#
# 架构：
#   ┌─────────────────┐     ┌──────────────────────┐
#   │  frontend        │     │  lens (后端)           │
#   │  Vite :3000      │────▶│  uvicorn :6565        │
#   │  (HMR 热重载)    │ API │  (生产镜像运行)        │
#   └─────────────────┘     └──────────────────────┘
#
# 访问地址：
#   前端：http://localhost:3000（Vite Dev Server，修改代码即时生效）
#   后端：http://localhost:6565（直接访问 API）

services:
  # ============================================================
  # 后端 — 从本地 Dockerfile 构建
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lens123
    ports:
      - "6565:6565"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/lens.db
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # ============================================================
  # 前端 — Vite Dev Server，HMR 热重载
  # ============================================================
  frontend:
    image: node:22-alpine
    container_name: lens-dev-frontend
    working_dir: /frontend
    ports:
      - "3050:3000"    # Vite Dev Server
    volumes:
      # 挂载前端源码（修改后 HMR 即时生效）
      - ./frontend:/frontend
      # 持久化 node_modules（避免每次重新 install）
      - frontend_node_modules:/frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true    # Docker 内文件监听需要
    command: >
      sh -c "
        npm config set registry https://registry.npmmirror.com/ &&
        npm install &&
        npm run dev
      "
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
